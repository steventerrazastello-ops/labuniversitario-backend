spring.application.name=labuniversitario-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.issuer=labuniversitario
app.jwt.secret=${JWT_SECRET:bGFiVW5pdmVyc2l0YXJpbzIwMjZzZWNyZXRhSldUMTIzNDU=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
